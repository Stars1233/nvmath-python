[build-system]
requires = [
    # < 3.2.0: https://github.com/cython/cython/issues/7122
    "Cython>=3.2.0",
    "setuptools>=77.0.3",
    "tomli>=2.0.1; python_version < '3.11'",
    # whatever version works here, see builder/utils.py for detail
    "cuda-toolkit[cudart,nvcc] >=13.1,<14",
]
build-backend = "setuptools.build_meta"


[project]
name = "nvmath-python"
version = "1.0.0"
dynamic = [
    "readme",
]
requires-python = '>=3.10,<3.15'
description = "NVIDIA Math Python libraries"
authors = [
    { name = "NVIDIA Corporation" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "cuda-bindings",
    "cuda-core >=0.5.0,<2",
    "cuda-pathfinder>=1.5.1,<2.0",
    "numpy >=1.25,<3",
    "pywin32; platform_system=='Windows'"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 1 - Unstable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
]

[tool.setuptools]
py-modules = ["builder"]
include-package-data = false

[tool.setuptools.cmdclass]
build_ext = "builder.utils.build_ext"

[tool.setuptools.packages.find]
include = ["nvmath", "nvmath.*"]

[tool.setuptools.package-data]
'*' = ["*.pxd", "copy_kernel/*.h", "copy_kernel_impl/*.h"]

[tool.setuptools.dynamic]
readme = { file = ["DESCRIPTION.rst"], content-type = "text/x-rst" }

[project.optional-dependencies]
cpu = [
    # what on Linux gives platform.machine() == x86_64, on Windows becomes AMD64
    "mkl; platform_machine=='x86_64' or platform_machine=='AMD64'",
    "nvpl-fft >=0.3,<1; platform_system=='Linux' and platform_machine=='aarch64'",
    "nvpl-blas >=0.3,<1; platform_system=='Linux' and platform_machine=='aarch64'",
]
sysctk12 = [
    "cuda-bindings >=12.9.2,<13",
    "cutensor-cu12 >=2.5.0, <3",
]
sysctk13 = [
    "cuda-bindings >=13.0.1,<14",
    "cutensor-cu13 >=2.5.0, <3",
]
cu12 = [
    "nvmath-python[sysctk12]",
    "cuda-core[cu12]",
    # We cannot use the cuda-toolkit metapackage for CUDA 12 because
    # some pytorch builds mix components from different CTK releases
    "nvidia-cublas-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudss-cu12 == 0.8.*",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cusparse-cu12",
    "cutensor-cu12 >=2.5.0, <3",
]
cu13 = [
    "nvmath-python[sysctk13]",
    "cuda-core[cu13]",
    "cuda-toolkit[cublas,nvrtc,cudart,cufft,curand,cusolver,cusparse]==13.*",
    "nvidia-cudss-cu13 == 0.8.*",
    "cutensor-cu13 >=2.5.0, <3",
]
numba = [
    "cffi",
    "llvmlite",
    # numba-cuda defines version restriction
    "numba",
    "numba-cuda >=0.28.1, <1",
    "numba-cuda-mlir >=0.4.1, <1; python_version >= '3.11'",
]
sysctk12-dx = [
    "nvmath-python[sysctk12]",
    "nvmath-python[numba]",
]
cu12-dx = [
    "nvmath-python[cu12]",
    "nvmath-python[numba]",
    "nvidia-libmathdx-cu12 >=0.3.1,<0.4.0,!=0.3.1.8",
    # Extra restrictions:
    # Earlier versions have missing header files
    "nvidia-cuda-cccl-cu12 > 12.4.127",
    # For nvmath.device use of NVRTC. [Known bugs exist for 12.4.0, 12.4.1,
    #  12.5.0]
    "nvidia-cuda-nvrtc-cu12 !=12.4.*, !=12.5.0",
]
sysctk12-distributed = [
    "nvmath-python[sysctk12]",
    "nvidia-nccl-cu12 >= 2.29.2; platform_system == 'Linux'",
    "nccl4py >= 0.3.1, < 0.4; platform_system == 'Linux'",
]
cu12-distributed = [
    "nvmath-python[cu12]",
    "nvmath-python[sysctk12-distributed]",
    "nvidia-cublasmp-cu12 >= 0.8.1,<0.10; platform_system == 'Linux'",
    "nvidia-cufftmp-cu12; platform_system == 'Linux'",
    "nvidia-cusolvermp-cu12 >= 0.8.0,<0.10; platform_system == 'Linux'",
    "nvidia-nvshmem-cu12 >= 3.2.5; platform_system == 'Linux'",
]
sysctk13-dx = [
    "nvmath-python[sysctk13]",
    "nvmath-python[numba]",
]
cu13-dx = [
    "nvmath-python[cu13]",
    "nvmath-python[numba]",
    "nvidia-libmathdx-cu13 >=0.3.1,<0.4.0,!=0.3.1.8",
    "cuda-toolkit[cccl,nvrtc]==13.*",
]
sysctk13-distributed = [
    "nvmath-python[sysctk13]",
    "nvidia-nccl-cu13 >= 2.29.2; platform_system == 'Linux'",
    "nccl4py >= 0.3.1, < 0.4; platform_system == 'Linux'",
]
cu13-distributed = [
    "nvmath-python[cu13]",
    "nvmath-python[sysctk13-distributed]",
    "cuda-toolkit[cublas] >= 13.0.2; platform_system == 'Linux'",
    "nvidia-cublasmp-cu13 >= 0.8.1,<0.10; platform_system == 'Linux'",
    # TODO: add cufftmp ctk13 when available
    "nvidia-cufftmp-cu13 >= 12.1.3.2; platform_system == 'Linux'",
    "nvidia-cusolvermp-cu13 >= 0.8.0,<0.10; platform_system == 'Linux'",
    "nvidia-nvshmem-cu13 >= 3.2.5; platform_system == 'Linux'",
]


[dependency-groups]
cupy-oldest-cu12 = [
    "cupy-cuda12x ==12.1.*",
    "numpy ==1.25.*",
    "cuda-core ==0.5.0",
]
dev = [
    { include-group = 'lint' },
    "invoke",
    "reno >=4.1,<5",
]
dev-cu13 = [
    { include-group = 'tests-cu13' },
    { include-group = 'cupy-cu13' },
    { include-group = 'dev' },
]
dev-cu12 = [
    { include-group = 'tests-cu12' },
    { include-group = 'cupy-cu12' },
    { include-group = 'dev' },
]
lint = [
  "ruff",
  "pre-commit",
]
docs = [
    "breathe",
    "enum-tools",
    "grip",
    "jupyter",
    "mpi4py",
    "myst-parser",
    "nbconvert <7.5",  # to enable pandoc CLI < 2.14.2
    "nbsphinx",
    "nbsphinx-link",
    "nccl4py >= 0.3.1, < 0.4; platform_system == 'Linux'",
    "nvidia-sphinx-theme",
    "pandoc",
    "pydata-sphinx-theme >=0.18",  # to enable sticky banners
    "reno[sphinx] >=4.1,<5",
    # TODO: enum-tools <0.13.0 breaks with sphinx >=9
    "sphinx <9",
    "sphinx-favicon",
    "sphinx-toolbox",
    "sphinxcontrib-programoutput",
    "sphinx-substitution-extensions",
    "sphinx-tabs",
]
build-wheel = [
    "auditwheel",
    "build",
    "pyproject-validate",
    "wheel",
]
mpich = [
    "mpi4py",
    "mpich",
]
notebooks-cu129 = [
    "jupyter",
    "matplotlib",
    "nbconvert",
    "torchvision",
]
openmpi = [
    "mpi4py",
    "openmpi",
]
cupy-cu12 = [
    "cupy-cuda12x >= 12.1",
]
cupy-cu13 = [
    "cupy-cuda13x",
]
tests = [
    "cffi",
    "hypothesis",
    "opt_einsum",
    "packaging",
    "psutil",
    "pytest",
    "pytest-repeat",
    "pytest-xdist",
    "scipy",
]
tests-cu12 = [
    { include-group = 'tests' },
]
tests-cu13 = [
    { include-group = 'tests' },
]
tests-dx = [
    "nvidia-mathdx ~= 25.6.0",
]
tests-dx-sysctk12 = [
    { include-group = 'tests-cu12' },
    { include-group = 'tests-dx' },
]
tests-dx-cu12 = [
    { include-group = 'tests-dx-sysctk12' },
    # TODO: use ctk12 version when pypi package is available
    # TODO: use cuda-toolkit[nvdisasm] version when all pypi packages are available
    "nvidia-cuda-nvdisasm >= 13.2",
]
tests-dx-sysctk13 = [
    { include-group = 'tests-cu13' },
    { include-group = 'tests-dx' },
]
tests-dx-cu13 = [
    { include-group = 'tests-dx-sysctk13' },
    # TODO: use cuda-toolkit[nvdisasm] version when all pypi packages are available
    "nvidia-cuda-nvdisasm >= 13.2",
]
tests-dx-dev-cu13 = [
    { include-group = 'tests-dx-cu13' },
    "nvidia-libmathdx-cu13 >= 0.3.2.dev0, <= 0.3.3.dev515"
]
torch-cu121 = [
    "torch ==2.1.*; platform_machine != 'aarch64'",
    "triton; platform_system!='Windows' and platform_machine != 'aarch64'",
]
torch-cu126 = [
    # Some builds of torch don't depend on these wheels, so we have to manually add them here
    "nvidia-cudnn-cu12==9.10.*; platform_system == 'Linux'",
    "nvidia-cusparselt-cu12==0.7.*; platform_system == 'Linux'",
    "nvidia-nccl-cu12>=2.21,<3; platform_system == 'Linux'",
    # torch wheels pin nvjitlink but not related compiler packages.
    # However, if packages do not match then lto_callback tests will fail.
    # torch wheels depend on nvidia wheels; do not add if testing system ctk
    "cuda-toolkit[cccl,nvcc,nvrtc,cudart,cublas,cufft,curand,cufile,cupti,cusolver,cusparse,nvjitlink]==12.6.*",
    # torch >=2.9 to support python ==3.14.*
    "torch >=2.9",
    "triton; platform_system!='Windows'",
]
torch-cu128 = [
    # torch wheels pin nvjitlink but not related compiler packages.
    # However, if packages do not match then lto_callback tests will fail.
    # torch wheels depend on nvidia wheels; do not add if testing system ctk
    "cuda-toolkit[cccl,nvcc,nvrtc,cudart,nvjitlink]==12.8.*",
    # torch >=2.9 to support python ==3.14.*
    "torch ==2.9.*",
    "triton >=3.4.0; platform_system!='Windows'",
]
torch-cu129 = [
    # torch wheels pin nvjitlink but not related compiler packages.
    # However, if packages do not match then lto_callback tests will fail.
    # torch wheels depend on nvidia wheels; do not add if testing system ctk
    "cuda-toolkit[cccl,nvcc,nvrtc,cudart,nvjitlink]==12.9.*",
    # torch >=2.9 to support python ==3.14.*
    "torch ==2.9.*",
    "triton >=3.4.0; platform_system!='Windows'",
]
torch-cu130 = [
    # torch wheels pin nvjitlink but not related compiler packages.
    # However, if packages do not match then lto_callback tests will fail.
    # torch wheels depend on nvidia wheels; do not add if testing system ctk
    "cuda-toolkit[cccl,nvcc,nvrtc,cudart,nvjitlink]==13.0.*",
    # torch >=2.9 to support python ==3.14.*
    "torch ==2.10.*",
    "triton >=3.4.0; platform_system!='Windows'",
]
torch-cu130-nightly = [
    # torch wheels pin nvjitlink but not related compiler packages.
    # However, if packages do not match then lto_callback tests will fail.
    # torch wheels depend on nvidia wheels; do not add if testing system ctk
    "cuda-toolkit[cccl,nvcc,nvrtc,cudart,nvjitlink]==13.0.*",
    # torch >=2.9 to support python ==3.14.*
    "torch >=2.11.0.dev20260101",
    "triton >=3.4.0; platform_system!='Windows'",
]

[tool.nvmath-bindings]
modules = [
    "nvmath.bindings.cublas",
    "nvmath.bindings.cublasLt",
    "nvmath.bindings.cudss",
    "nvmath.bindings.cufft",
    "nvmath.bindings.curand",
    "nvmath.bindings.cusolver",
    "nvmath.bindings.cusolverDn",
    "nvmath.bindings.cusolverSp",
    "nvmath.bindings.cusparse",
    "nvmath.bindings.cusparseLt",
    "nvmath.bindings.cutensor",
    "nvmath.bindings.mathdx",
    "nvmath.bindings.nvpl.blas",
    "nvmath.bindings.nvpl.fft",
]
linux_modules = [
    "nvmath.bindings.cublasMp",
    "nvmath.bindings.cufftMp",
    "nvmath.bindings.cusolverMp",
    "nvmath.bindings.nvshmem",
]
internal_modules = [
    "nvmath.bindings._internal.utils",
    "nvmath.internal._bindings",
    "nvmath.internal._layout._layout",
    "nvmath.internal.memory",
    "nvmath.internal.ndbuffer._copy_kernel",
    "nvmath.internal.ndbuffer._jit",
    "nvmath.internal.ndbuffer._ndbuffer",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", group='torch-cu121' },
  { index = "pytorch-cu126", group='torch-cu126' },
  { index = "pytorch-cu128", group='torch-cu128' },
  { index = "pytorch-cu129", group='torch-cu129' },
  { index = "pytorch-cu130", group='torch-cu130' },
  { index = "pytorch-cu130-nightly", group='torch-cu130-nightly' },
]
triton = [
  { index = "pytorch-cu121", group='torch-cu121' },
  { index = "pytorch-cu126", group='torch-cu126' },
  { index = "pytorch-cu128", group='torch-cu128' },
  { index = "pytorch-cu129", group='torch-cu129' },
  { index = "pytorch-cu130", group='torch-cu130' },
  { index = "pytorch-cu130-nightly", group='torch-cu130-nightly' },
]
torchvision = [
  { index = "pytorch-cu129", group='notebooks-cu129' },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130-nightly"
url = "https://download.pytorch.org/whl/nightly/cu130"
explicit = true

[tool.ruff]
line-length = 128
# Don't format autogenerated files
exclude = [
    "nvmath/device/curand_kernel.py",
    "nvmath/bindings",
    "nvmath/internal/memory.pyi",
    "nvmath/internal/ndbuffer/*.pyi",
    "nvmath/internal/_layout/*.pyi",
]
# Check against minimal supported version Python 3.10
target-version = "py310"


[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint.pycodestyle]
max-doc-length = 92
max-line-length = 128

[tool.ruff.lint]
select = [
    # pycodestyle Error
    "E",
    # Pyflakes
    "F",
    # pycodestyle Warning
    "W",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-comprehensions
    "C4",
    "SLOT",
    "PLE",
]
ignore = [
    # FIXME
    # This list of ignored rules should be reduced. Many will be handled
    # automatically when enabling ruff-format.
    # Ignore missing stacklevel arg to warnings.warn
    "B028",
    # Ignore swapping try-except-pass for contextlib.suppress
    "SIM105",
    # Ignore forcing terary expressions
    "SIM108",
    # Ignore bare-except
    "E722",
    # Ignore lambda-assignment
    "E731",
]
fixable = ["ALL"]

[tool.codespell]
ignore-words-list = "FO,inout,matA,matB,matC,unix,braket,ND,halfs,coo"
write-changes = ""
# base64 workaround
# https://github.com/codespell-project/codespell/issues/2801
ignore-regex = '[A-Za-z0-9+/]{100,}'
exclude = [
    "nvmath/device/curand_kernel.py",
]
skip = "nvmath/bindings/*"

[tool.mypy]
python_version = "3.10"
disable_error_code = "import-untyped"
explicit_package_bases = true

# Don't check autogenerated files
[[tool.mypy.overrides]]
module = "nvmath.bindings.*"
ignore_errors = true

# This is cythonized module with stubgen generated stub
[[tool.mypy.overrides]]
module = "nvmath.internal.memory"
ignore_errors = true

# This is cythonized module with stubgen generated stub
[[tool.mypy.overrides]]
module = "nvmath.internal.ndbuffer.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "nvmath.internal._layout.*"
ignore_errors = true

# TODO: add support
[[tool.mypy.overrides]]
module = "examples.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "internal.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true

# FIXME: Stop ignoring mpi4py when wheel is published
[[tool.mypy.overrides]]
module = ["mpi4py.*"]
ignore_missing_imports = true

# TODO: Remove once numba-cuda-mlir is public and added to dependencies
[[tool.mypy.overrides]]
module = ["numba_cuda_mlir.*"]
ignore_missing_imports = true


[tool.ruff.lint.per-file-ignores]
# @cuda.jit kernels defined in loops intentionally capture loop variables as
# compile-time constants; default args cannot be used on GPU kernel functions.
"examples/device/*/linalg/matmul/04_gemm_blockdim/cublasdx_blockdim_gemm_fp16.py" = ["B023"]
"examples/device/*/fft/autotuning/cufftdx_extra_autotuning.py" = ["B023"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "nvmath.device.cublasdx_backend.TransposeMode",
]
